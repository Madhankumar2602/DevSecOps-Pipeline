# OWASP ZAP baseline rules. Format: <rule-id><TAB><IGNORE|WARN|FAIL><TAB>(name)
# Any FAIL rule that triggers breaks the Jenkins build. Unlisted rules default to WARN.
10010	FAIL	(Cookie No HttpOnly Flag)
10011	WARN	(Cookie Without Secure Flag - lab runs over plain HTTP)
10017	FAIL	(Cross-Domain JavaScript Source File Inclusion)
10020	FAIL	(Missing Anti-clickjacking Header)
10021	FAIL	(X-Content-Type-Options Header Missing)
10023	FAIL	(Information Disclosure - Debug Error Messages)
10035	IGNORE	(Strict-Transport-Security - TLS terminates at the load balancer, not the pod)
10036	FAIL	(Server Leaks Version Information via Server header)
10037	FAIL	(Server Leaks Information via X-Powered-By)
10038	FAIL	(Content Security Policy Header Not Set)
10054	FAIL	(Cookie without SameSite Attribute)
10063	WARN	(Permissions Policy Header Not Set)
10096	IGNORE	(Timestamp Disclosure - false positives from ISO dates in the API)
10098	FAIL	(Cross-Domain Misconfiguration)
10202	WARN	(Absence of Anti-CSRF Tokens)
90022	FAIL	(Application Error Disclosure)
90033	FAIL	(Loosely Scoped Cookie)
